pipeline:
  name: IaCM Plan Apply Pipeline
  identifier: iacm_plan_apply_pipeline
  projectIdentifier: YOUR_PROJECT_ID  # Update with your Harness project identifier before importing
  orgIdentifier: YOUR_ORG_ID          # Update with your Harness org identifier before importing
  tags: {}
  stages:
    - stage:
        name: Plan and Apply
        identifier: plan_and_apply
        type: IACM
        spec:
          workspace: YOUR_WORKSPACE_ID  # Update inside the pipeline studio after importing
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: IACMTerraformPlugin
                  name: init
                  identifier: init
                  spec:
                    command: init
              - step:
                  type: IACMTerraformPlugin
                  name: plan
                  identifier: plan
                  spec:
                    command: plan
              - step:
                  type: IACMApproval
                  name: Approve Apply
                  identifier: approve_apply
                  timeout: 1d
                  spec: {}
              - step:
                  type: IACMTerraformPlugin
                  name: apply
                  identifier: apply
                  spec:
                    command: apply
        tags: {}
